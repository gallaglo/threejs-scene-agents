[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["threejs_scene_generator/**"]
exclude = [
    "threejs_scene_generator/.adk/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[project]
name = "threejs-scene-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.1.0",
    "google-cloud-aiplatform[agent_engines]>=1.93.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
